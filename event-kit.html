    <div><a href="/">五大方向</a> · <a href="/event-kits.html">事件包</a> · <a href="/tools.html">工具總覽</a> · <a href="/lawyers.html">律師媒合</a></div>

<script src="/js/event-kits-data.js"></script>
<script>
  var year = document.getElementById('year');
  if (year) year.textContent = new Date().getFullYear();

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, function (char) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[char];
    });
  }

  function renderList(items) {
    var safeItems = Array.isArray(items) ? items : [];
    if (!safeItems.length) return '<p class="summary">目前尚未整理資料。</p>';
    return '<ul class="list">' + safeItems.map(function (item) {
      return '<li>' + escapeHtml(item) + '</li>';
    }).join('') + '</ul>';
  }

  function renderTools(tools) {
    if (!tools || !tools.length) return '<p class="summary">目前尚未綁定工具。</p>';
    return '<div class="tool-links">' + tools.map(function (tool) {
      return '<a href="' + escapeHtml(tool.href) + '">' + escapeHtml(tool.label) + '</a>';
    }).join('') + '</div>';
  }

  function takeItems(items, limit) {
    return (items || []).slice(0, limit);
  }

  function renderGuidedFlow(kit) {
    if (!kit.guidedFlow || !kit.guidedFlow.steps || !kit.guidedFlow.steps.length) return '';
    return [
      '<article class="panel guided-panel">',
      '<div class="guide-header">',
      '<div>',
      '<h2>把你的狀況整理成一張處理清單</h2>',
      '<p class="guided-intro">' + escapeHtml(kit.guidedFlow.intro || '依序回答目前狀況，頁面會把下一步、文件與可搭配使用的工具整理成短清單。') + '</p>',
      '</div>',
      '<div class="guide-label">約 3 分鐘</div>',
      '</div>',
      '<div class="guide-promise">',
      '<div class="promise-card"><strong>現在卡在哪裡</strong><span>用幾個選項定位目前階段。</span></div>',
      '<div class="promise-card"><strong>接下來怎麼做</strong><span>整理三件優先處理的事項。</span></div>',
      '<div class="promise-card"><strong>資料要留什麼</strong><span>列出後續常會用到的文件與紀錄。</span></div>',
      '</div>',
      '<div class="flow-progress" id="flowProgress">第 01 題 / 共 ' + String(kit.guidedFlow.steps.length).padStart(2, '0') + ' 題</div>',
      kit.guidedFlow.steps.map(function (step, stepIndex) {
        return [
          '<section class="flow-step" data-flow-step="' + escapeHtml(step.id) + '" data-step-index="' + stepIndex + '">',
          '<h3>' + String(stepIndex + 1).padStart(2, '0') + '｜' + escapeHtml(step.title) + '</h3>',
          '<p>' + escapeHtml(step.prompt) + '</p>',
          '<div class="option-grid">',
          step.options.map(function (option, optionIndex) {
            return [
              '<button class="flow-option" type="button" data-step="' + escapeHtml(step.id) + '" data-option="' + optionIndex + '">',
              '<strong>' + escapeHtml(option.label) + '</strong>',
              '<span>' + escapeHtml(option.note) + '</span>',
              '</button>'
            ].join('');
          }).join(''),
          '</div>',
          '</section>'
        ].join('');
      }).join(''),
      '<div class="flow-result" id="flowResult">',
      '<h3>你的處理清單</h3>',
      '<p class="summary">從第一題開始選。完成後，這裡會整理優先處理步驟、要準備的資料與可搭配使用的工具。</p>',
      '</div>',
      '</article>'
    ].join('');
  }

  function renderKit(kit) {
    document.title = kit.title + '｜ChouLegal 權益試算與查詢';
    var metaDescription = document.querySelector('meta[name="description"]');
    if (metaDescription) metaDescription.setAttribute('content', kit.summary);
    var statusLabel = kit.guidedFlow ? '可逐步作答' : '重點整理';
    var heroSuffix = kit.guidedFlow
      ? '回答下方問題後，頁面會整理一份初步處理清單。'
      : '下方整理適用情境、風險訊號、文件與相關工具。';
    return [
      '<section class="hero">',
      '<div class="eyebrow">' + escapeHtml(kit.category) + '</div>',
      '<h1>' + escapeHtml(kit.title) + '</h1>',
      '<p class="summary">' + escapeHtml(kit.summary) + ' ' + escapeHtml(heroSuffix) + '</p>',
      '<div class="meta-line">',
      '<span class="pill">' + escapeHtml(statusLabel) + '</span>',
      (kit.experts || []).map(function (expert) { return '<span class="pill">' + escapeHtml(expert) + '</span>'; }).join(''),
      '</div>',
      '</section>',
      '<section class="layout">',
      renderGuidedFlow(kit),
      '<div class="supplement-grid">',
      '<article class="panel context-panel"><h2>適合使用這頁的狀況</h2><p class="context-text">如果下列問題接近你的處境，可依本頁指引整理處理順序。</p>' + renderList(takeItems(kit.firstQuestions, 4)) + '</article>',
      '<article class="panel context-panel"><h2>處理時要留意</h2><p class="context-text">遇到這些狀況時，請妥善保留相關紀錄，避免僅以口頭約定處理。</p>' + renderList(takeItems(kit.riskSignals, 4)) + '</article>',
      '</div>',
      '<aside>',
      '<div class="aside-card"><div class="aside-title">必備文件</div>' + renderList(takeItems(kit.documents, 5)) + '</div>',
      '<div class="aside-card"><div class="aside-title">期限提醒</div>' + renderList(takeItems(kit.deadlines, 3)) + '</div>',
      '<div class="aside-card"><div class="aside-title">相關工具</div>' + renderTools(kit.tools) + '</div>',
      '<div class="aside-card lawyer-card"><div class="aside-title">需要個案協助時</div><h2>帶著事件包找律師</h2><p>本頁可協助你整理事件類型、期限、文件與工具結果。若需要法律意見、談判、文件審閱或訴訟代理，請改由執業律師判斷。</p><a class="next-link" href="/lawyers.html?event=' + encodeURIComponent(kit.id) + '">進入律師媒合</a></div>',
      '<div class="aside-card"><div class="aside-title">事件列表</div><a class="next-link" href="/event-kits.html">回事件包</a></div>',
      '</aside>',
      '</section>'
    ].join('');
  }

  function renderEmpty() {
    return '<section class="empty"><div class="eyebrow">Not Found</div><h1>找不到這個事件包。</h1><p class="summary">請回到事件包列表重新選擇。</p><p><a class="next-link" style="max-width:260px" href="/event-kits.html">回事件包</a></p></section>';
  }

  var params = new URLSearchParams(window.location.search);
  var kitId = params.get('id') || 'inheritance-after-death';
  var kits = window.CHOULEGAL_EVENT_KITS || [];
  var selectedKit = kits.find(function (kit) { return kit.id === kitId; });
  document.getElementById('app').innerHTML = selectedKit && selectedKit.status !== '規劃中' ? renderKit(selectedKit) : renderEmpty();

  function bindGuidedFlow(kit) {
    if (!kit || !kit.guidedFlow) return;
    var selections = {};
    var buttons = Array.prototype.slice.call(document.querySelectorAll('.flow-option'));
    var steps = Array.prototype.slice.call(document.querySelectorAll('.flow-step'));

    function updateStepState() {
      var firstOpenIndex = kit.guidedFlow.steps.findIndex(function (step) {
        return typeof selections[step.id] !== 'number';
      });
      var activeIndex = firstOpenIndex === -1 ? kit.guidedFlow.steps.length - 1 : firstOpenIndex;
      steps.forEach(function (stepEl, stepIndex) {
        var locked = stepIndex > activeIndex;
        stepEl.classList.toggle('locked', locked);
        Array.prototype.slice.call(stepEl.querySelectorAll('.flow-option')).forEach(function (button) {
          button.disabled = locked;
        });
      });
      var progress = document.getElementById('flowProgress');
      if (progress) {
        progress.textContent = firstOpenIndex === -1
          ? '已完成'
          : '第 ' + String(activeIndex + 1).padStart(2, '0') + ' 題 / 共 ' + String(kit.guidedFlow.steps.length).padStart(2, '0') + ' 題';
      }
    }

    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        if (button.disabled) return;
        var stepId = button.getAttribute('data-step');
        var optionIndex = Number(button.getAttribute('data-option'));
        selections[stepId] = optionIndex;
        buttons
          .filter(function (candidate) { return candidate.getAttribute('data-step') === stepId; })
          .forEach(function (candidate) { candidate.classList.remove('active'); });
        button.classList.add('active');
        updateStepState();
        renderFlowResult(kit, selections);
      });
    });
    updateStepState();
  }

  function renderFlowResult(kit, selections) {
    var result = document.getElementById('flowResult');
    if (!result) return;
    var selectedOptions = kit.guidedFlow.steps
      .map(function (step) {
        var optionIndex = selections[step.id];
        return typeof optionIndex === 'number' ? step.options[optionIndex] : null;
      })
      .filter(Boolean);
    if (!selectedOptions.length) return;
    function collect(field) {
      return selectedOptions.reduce(function (items, option) {
        (option[field] || []).forEach(function (item) {
          if (!items.includes(item)) items.push(item);
        });
        return items;
      }, []);
    }
    var flags = selectedOptions.reduce(function (items, option) {
      (option.flags || []).forEach(function (flag) {
        if (!items.includes(flag)) items.push(flag);
      });
      return items;
    }, []);
    var actions = collect('actions');
    var documents = collect('documents');
    var toolKeys = collect('toolKeys').concat(kit.guidedFlow.recommendedTools || []);
    var recommendedTools = (kit.tools || []).filter(function (tool) {
      return toolKeys.some(function (key) { return tool.href.indexOf('/' + key + '.html') !== -1; });
    });
    var answeredCount = selectedOptions.length;
    var totalCount = kit.guidedFlow.steps.length;
    var currentOption = selectedOptions[selectedOptions.length - 1];
    function firstItems(items, limit) {
      return items.slice(0, limit);
    }
    function prioritizedItems(field, fallbackItems) {
      var items = [];
      function add(item) {
        if (!items.includes(item)) items.push(item);
      }
      (currentOption[field] || []).forEach(add);
      selectedOptions.slice(0, -1).forEach(function (option) {
        (option[field] || []).forEach(add);
      });
      (fallbackItems || []).forEach(add);
      return items;
    }
    var nextPrompt = answeredCount < totalCount
      ? '接著回答「' + kit.guidedFlow.steps[answeredCount].title + '」。'
      : '初步分流完成。將資料整理妥當後，可使用工具估算或準備尋求諮詢。';
    var visibleActions = firstItems(prioritizedItems('actions', selectedOptions.map(function (option) { return option.note; })), 3);
    var visibleDocuments = firstItems(prioritizedItems('documents', kit.documents), 6);
    var visibleFlags = firstItems(flags, 4);
    var visibleTools = firstItems(recommendedTools.length ? recommendedTools : kit.tools, 3);
    result.innerHTML = [
      '<h3>下一步怎麼做</h3>',
      '<p class="summary">' + escapeHtml(currentOption.note) + ' ' + escapeHtml(nextPrompt) + '</p>',
      visibleFlags.length ? '<div class="flow-tags">' + visibleFlags.map(function (flag) { return '<span>' + escapeHtml(flag) + '</span>'; }).join('') + '</div>' : '',
      '<div class="flow-result-grid">',
      '<section class="flow-section"><h4>優先進行的三個步驟</h4>' + renderList(visibleActions) + '</section>',
      '<section class="flow-section"><h4>應備資料</h4>' + renderList(visibleDocuments) + '</section>',
      '</div>',
      '<p class="flow-note">若申辦期限將至、有人催促簽署文件，或金額與責任歸屬尚未釐清，請先妥善保留相關紀錄，再決定是否使用工具估算或諮詢專業人士。</p>',
      '<div style="margin-top:16px">',
      '<div class="aside-title">建議工具</div>',
      renderTools(visibleTools),
      '</div>'
    ].join('');
  }

  bindGuidedFlow(selectedKit);
</script>
